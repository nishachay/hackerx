name: Request removal
description: Ask us to remove a post or HN comment from HackerX.
title: "Removal request: "
labels: ["removal"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what to remove. We aim to act within 24 hours.
  - type: input
    id: link
    attributes:
      label: Link to the post or Hacker News comment
      description: The x.com post URL or the Hacker News comment URL you want removed.
      placeholder: https://x.com/... or https://news.ycombinator.com/item?id=...
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why should it be removed? For example, you are the author, or it contains personal information.
    validations:
      required: true
