name: Weekly HackerX data refresh

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      from_date:
        description: First UTC date to pull (useful for a backfill)
        required: false
        default: "2007-01-01"
        type: string

permissions:
  contents: write

concurrency:
  group: hackerx-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore HN cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: hackerx-pipeline-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hackerx-pipeline-${{ runner.os }}-
      - name: Pull Hacker News records
        env:
          START_DATE: ${{ inputs.from_date || '2007-01-01' }}
        run: python pipeline/pull_hn.py --from "$START_DATE"
      # Save finished ranges even when some failed, so the next run resumes
      # instead of pulling every range since 2007 again.
      - name: Save HN cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: hackerx-pipeline-${{ runner.os }}-${{ github.run_id }}
      # data/*.json is gitignored on purpose, so the pulled records are kept
      # as a run artifact instead of a commit to main.
      - name: Upload pulled HN records
        uses: actions/upload-artifact@v4
        with:
          name: hn-records
          path: |
            data/hn-hits.json
            data/hn-pull-summary.json
          retention-days: 30
